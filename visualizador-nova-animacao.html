<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Visualizador da sequência PNG da nova simulação hidrodinâmica.">
  <title>Nova simulação hidrodinâmica — Animação</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #101923; color: #eef6fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 18px 22px 10px; }
    h1 { margin: 0; font-size: clamp(1.2rem, 3vw, 1.8rem); }
    header p { margin: 6px 0 0; color: #b7cbd7; }
    main { flex: 1; display: grid; place-items: center; padding: 16px 22px; }
    .viewer { width: min(1200px, 100%); }
    .stage { min-height: 260px; display: grid; place-items: center; overflow: hidden; border: 1px solid #385366; border-radius: 10px; background: #5e5b59; }
    #frame { display: block; max-width: 100%; max-height: 72vh; object-fit: contain; }
    #frame[hidden] { display: none; }
    #message { padding: 24px; color: #ffcc80; text-align: center; }
    #message[hidden] { display: none; }
    .controls { display: grid; grid-template-columns: auto auto minmax(100px, 1fr) auto auto; align-items: center; gap: 10px; margin-top: 12px; }
    button, select { padding: 8px 12px; border: 1px solid #4fc3f7; border-radius: 6px; background: #15384d; color: #eef6fb; font: inherit; }
    button { cursor: pointer; }
    button:hover:not(:disabled) { background: #205775; }
    button:disabled, select:disabled, input:disabled { cursor: not-allowed; opacity: .6; }
    input[type="range"] { width: 100%; accent-color: #4fc3f7; }
    #status { grid-column: 1 / -1; color: #c6d6df; font-size: .9rem; }
    footer { padding: 0 22px 18px; color: #a9bac5; font-size: .85rem; line-height: 1.5; }
    code { color: #d7efff; }
    @media (max-width: 650px) { .controls { grid-template-columns: auto auto 1fr; } #status { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <header>
    <h1>Nova simulação hidrodinâmica</h1>
    <p>Animação independente usando os quadros PNG publicados no repositório.</p>
  </header>
  <main>
    <section class="viewer" aria-label="Visualizador da nova simulação">
      <div class="stage">
        <img id="frame" alt="Quadro da nova simulação" hidden>
        <div id="message" role="status" aria-live="polite">Carregando os quadros PNG…</div>
      </div>
      <div class="controls">
        <button id="previous" type="button" disabled>◀ Anterior</button>
        <button id="play" type="button" disabled aria-pressed="false">▶ Reproduzir</button>
        <input id="seek" type="range" min="0" max="0" value="0" aria-label="Selecionar quadro" disabled>
        <label for="speed">Velocidade</label>
        <select id="speed" disabled>
          <option value="500">2 quadros/s</option>
          <option value="200">5 quadros/s</option>
          <option value="100" selected>10 quadros/s</option>
          <option value="50">20 quadros/s</option>
        </select>
        <button id="next" type="button" disabled>Próximo ▶</button>
        <div id="status" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <footer>Quadros <code>imagem.0000.png</code> a <code>imagem.0043.png</code> (quadros ausentes são ignorados). Após a publicação, recarregue sem cache com <strong>Ctrl+F5</strong>.</footer>

  <script>
    (() => {
      const firstNumber = 0;
      const lastNumber = 43;
      const image = document.getElementById("frame");
      const message = document.getElementById("message");
      const previousButton = document.getElementById("previous");
      const playButton = document.getElementById("play");
      const nextButton = document.getElementById("next");
      const seek = document.getElementById("seek");
      const speed = document.getElementById("speed");
      const status = document.getElementById("status");
      let frames = [];
      let current = 0;
      let timer = null;

      function pathFor(number) {
        return `./imagem.${String(number).padStart(4, "0")}.png`;
      }

      function checkFrame(number) {
        return new Promise(resolve => {
          const probe = new Image();
          let settled = false;
          const finish = result => {
            if (settled) return;
            settled = true;
            window.clearTimeout(timeout);
            resolve(result);
          };
          const timeout = window.setTimeout(() => finish(null), 12000);
          probe.onload = () => finish({ number, src: probe.src });
          probe.onerror = () => finish(null);
          probe.src = pathFor(number);
        });
      }

      function showFrame(index) {
        if (!frames.length) return;
        current = (index + frames.length) % frames.length;
        const selected = frames[current];
        image.src = selected.src;
        image.alt = `Quadro ${current + 1} de ${frames.length}`;
        image.hidden = false;
        seek.value = String(current);
        status.textContent = `Quadro ${current + 1} de ${frames.length} — imagem.${String(selected.number).padStart(4, "0")}.png`;
      }

      function stop() {
        if (timer !== null) window.clearInterval(timer);
        timer = null;
        playButton.textContent = "▶ Reproduzir";
        playButton.setAttribute("aria-pressed", "false");
      }

      function start() {
        if (timer !== null || frames.length < 2) return;
        playButton.textContent = "❚❚ Pausar";
        playButton.setAttribute("aria-pressed", "true");
        timer = window.setInterval(() => showFrame(current + 1), Number(speed.value));
      }

      async function initialize() {
        try {
          const numbers = Array.from({ length: lastNumber - firstNumber + 1 }, (_, index) => firstNumber + index);
          const results = await Promise.all(numbers.map(checkFrame));
          frames = results.filter(Boolean);

          if (!frames.length) {
            message.textContent = "Os PNGs não responderam. Confirme se imagem.0000.png está acessível na raiz do GitHub Pages e tente novamente.";
            return;
          }

          message.hidden = true;
          seek.max = String(frames.length - 1);
          [previousButton, playButton, nextButton, seek, speed].forEach(control => { control.disabled = false; });
          showFrame(0);
        } catch (error) {
          message.textContent = "Falha ao carregar os quadros. Recarregue a página; se persistir, verifique a publicação do GitHub Pages.";
          console.error(error);
        }
      }

      previousButton.addEventListener("click", () => showFrame(current - 1));
      nextButton.addEventListener("click", () => showFrame(current + 1));
      playButton.addEventListener("click", () => timer === null ? start() : stop());
      seek.addEventListener("input", () => showFrame(Number(seek.value)));
      speed.addEventListener("change", () => {
        if (timer !== null) { stop(); start(); }
      });
      image.addEventListener("error", () => {
        stop();
        image.hidden = true;
        message.hidden = false;
        message.textContent = "Não foi possível exibir o quadro. Confirme se os PNGs estão publicados.";
      });

      initialize();
    })();
  </script>
</body>
</html>
